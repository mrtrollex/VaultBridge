name: Bug report
description: Report reproducible VaultBridge behaviour that appears incorrect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VaultBridge version
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/TrueNAS, Docker version, CPU architecture. Do not include API keys or private vault content.
