name: Publish GHCR image

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vaultbridge

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Compile application
        run: python -m compileall -q app
      - name: Validate Compose
        env:
          API_KEY: ci-placeholder-secret
          OBSIDIAN_VAULT_PATH: /tmp/vault
        run: |
          mkdir -p /tmp/vault
          docker compose config >/dev/null

  publish:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Validate release contract
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $semver_pattern ]]; then
            echo "::error::Release tag must be v-prefixed SemVer without build metadata."
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-* && "$RELEASE_IS_PRERELEASE" != "true" ]]; then
            echo "::error::A prerelease SemVer tag must be marked as a GitHub prerelease."
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Generate normalized image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lowercases image names, including the owner from GitHub context.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},priority=900
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},priority=800,enable=${{ ! github.event.release.prerelease }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }},priority=700,enable=${{ ! github.event.release.prerelease }}
            type=raw,value=latest,priority=200,enable=${{ ! github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.licenses=MIT
      - name: Require generated release tags
        if: steps.meta.outputs.tags == ''
        run: |
          echo "::error::No safe image tags were generated for this release."
          exit 1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Minimal BuildKit provenance adds build origin without external signing credentials.
          provenance: mode=min
      - name: Inspect published manifest
        shell: bash
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "$IMAGE_REF@$IMAGE_DIGEST"
