name: Publish GHCR image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub Release tag to recover
        required: true
        type: string
      expected_source_sha:
        description: Full commit SHA that the release tag must resolve to
        required: true
        type: string
      expected_prerelease:
        description: Must match the GitHub Release prerelease state
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-ghcr-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vaultbridge

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_is_prerelease: ${{ steps.release.outputs.release_is_prerelease }}
      release_source_sha: ${{ steps.source.outputs.release_source_sha }}
    steps:
      - name: Resolve and validate published release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_SOURCE_SHA: ${{ github.sha }}
          EVENT_RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RECOVERY_RELEASE_TAG: ${{ inputs.release_tag }}
          RECOVERY_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          RECOVERY_EXPECTED_PRERELEASE: ${{ inputs.expected_prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$RECOVERY_RELEASE_TAG"
            expected_source_sha="$RECOVERY_EXPECTED_SOURCE_SHA"
            expected_prerelease="$RECOVERY_EXPECTED_PRERELEASE"
          else
            release_tag="$EVENT_RELEASE_TAG"
            expected_source_sha="$EVENT_RELEASE_SOURCE_SHA"
            expected_prerelease="$EVENT_RELEASE_IS_PRERELEASE"
          fi

          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$release_tag" =~ $semver_pattern ]]; then
            echo "::error::Release tag must be v-prefixed SemVer without build metadata."
            exit 1
          fi
          if [[ "$expected_prerelease" != "true" && "$expected_prerelease" != "false" ]]; then
            echo "::error::Expected prerelease state must be true or false."
            exit 1
          fi
          if [[ ! "$expected_source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release source must be a full lowercase commit SHA."
            exit 1
          fi
          if [[ "$release_tag" == *-* && "$expected_prerelease" != "true" ]]; then
            echo "::error::A prerelease SemVer tag must be marked as a GitHub prerelease."
            exit 1
          fi

          if ! release_fields="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" \
              --jq '[.tag_name, .draft, .prerelease, (.published_at // "")] | @tsv'
          )"; then
            echo "::error::GitHub Release ${release_tag} does not exist or is not accessible."
            exit 1
          fi

          IFS=$'\t' read -r api_tag release_is_draft release_is_prerelease published_at \
            <<<"$release_fields"

          if [[ "$api_tag" != "$release_tag" ]]; then
            echo "::error::GitHub Release tag does not match the requested tag."
            exit 1
          fi
          if [[ "$release_is_draft" != "false" || -z "$published_at" ]]; then
            echo "::error::GitHub Release ${release_tag} is not published."
            exit 1
          fi
          if [[ "$release_is_prerelease" != "$expected_prerelease" ]]; then
            echo "::error::GitHub Release prerelease state does not match the triggering event or recovery input."
            exit 1
          fi
          {
            echo "release_tag=$release_tag"
            echo "release_is_prerelease=$release_is_prerelease"
            echo "expected_source_sha=$expected_source_sha"
          } >>"$GITHUB_OUTPUT"
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.release_tag }}
          persist-credentials: false
      - name: Record checked-out release source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          EXPECTED_SOURCE_SHA: ${{ steps.release.outputs.expected_source_sha }}
        run: |
          set -euo pipefail
          release_source_sha="$(git rev-parse HEAD)"
          tag_source_sha="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          if [[ "$release_source_sha" != "$tag_source_sha" ]]; then
            echo "::error::Checked-out source does not match the release tag."
            exit 1
          fi
          if [[ -n "$EXPECTED_SOURCE_SHA" && "$release_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Release tag does not match the expected recovery source commit."
            exit 1
          fi
          echo "release_source_sha=$release_source_sha" >>"$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests scripts
      - name: Run unit and integration tests
        env:
          PYTHONPATH: .
        run: pytest -q --ignore=tests/e2e
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        env:
          PYTHONPATH: .
        run: >-
          pytest -q tests/e2e
          --browser=chromium
          --tracing=retain-on-failure
          --output=test-results/playwright
      - name: Compile application
        run: python -m compileall -q app
      - name: Validate Compose
        env:
          API_KEY: ci-placeholder-secret
          OBSIDIAN_VAULT_PATH: /tmp/vault
        run: |
          mkdir -p /tmp/vault
          docker compose config >/dev/null

  publish:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_source_sha }}
          persist-credentials: false
      - name: Verify checked-out release source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.release_source_sha }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Publish checkout does not match the verified release source."
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Generate normalized image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # metadata-action lowercases image names, including the owner from GitHub context.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.release_tag }},priority=900
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.release_source_sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.release_tag }}
            org.opencontainers.image.licenses=MIT
      - name: Require generated release tags
        if: steps.meta.outputs.tags == ''
        run: |
          echo "::error::No safe image tags were generated for this release."
          exit 1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Minimal BuildKit provenance adds build origin without external signing credentials.
          provenance: mode=min
      - name: Inspect published manifest
        shell: bash
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools inspect "$IMAGE_REF@$IMAGE_DIGEST"

  stable-aliases:
    name: Publish stable aliases
    needs: [verify, publish]
    if: needs.verify.outputs.release_is_prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-ghcr-stable-aliases
      cancel-in-progress: false
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile stable aliases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          set -euo pipefail
          latest_stable_tag="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name'
          )"
          stable_semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$latest_stable_tag" =~ $stable_semver_pattern ]]; then
            echo "::error::Latest stable GitHub Release tag is not supported SemVer."
            exit 1
          fi

          version="${latest_stable_tag#v}"
          image_repository="${IMAGE_REF%:*}"
          exact_image_ref="${image_repository}:${version}"
          docker buildx imagetools create \
            --tag "${image_repository}:${version%.*}" \
            --tag "${image_repository}:${version%%.*}" \
            --tag "${image_repository}:latest" \
            "$exact_image_ref"
