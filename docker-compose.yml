services:
  obsidian-api:
    build: .
    container_name: obsidian-chatgpt
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      API_KEY: ${API_KEY}
      API_KEY_PREVIOUS: ${API_KEY_PREVIOUS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_CLIENTS: ${RATE_LIMIT_MAX_CLIENTS:-1024}
      VAULT_PATH: /vault
      MAX_NOTE_BYTES: ${MAX_NOTE_BYTES:-1000000}
      SEMANTIC_DATA_PATH: /vault/.obsidian-chatgpt-data
      HF_HOME: /vault/.obsidian-chatgpt-data/huggingface
      SEMANTIC_MODEL: ${SEMANTIC_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      SEMANTIC_CHUNK_CHARS: ${SEMANTIC_CHUNK_CHARS:-600}
      SEMANTIC_CHUNK_OVERLAP: ${SEMANTIC_CHUNK_OVERLAP:-100}
      SEMANTIC_INDEX_BATCH_SIZE: ${SEMANTIC_INDEX_BATCH_SIZE:-25}
      SEMANTIC_WATCH_ENABLED: ${SEMANTIC_WATCH_ENABLED:-false}
      SEMANTIC_WATCH_DEBOUNCE_SECONDS: ${SEMANTIC_WATCH_DEBOUNCE_SECONDS:-1.0}
    volumes:
      - type: bind
        source: ${OBSIDIAN_VAULT_PATH}
        target: /vault
    ports:
      - "127.0.0.1:${API_PORT:-8765}:8000"
