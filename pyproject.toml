[project]
name = "vaultbridge"
version = "1.0.0"
description = "Self-hosted REST and semantic search API for an Obsidian vault."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
